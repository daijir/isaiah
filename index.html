<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>イザヤ書 個人研究ノート</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="旧約聖書「イザヤ書」全66章の個人研究ノート。末日聖徒の視点から聖文を現代に当てはめて読み解きます。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      --theme-color: #2c5282;
    }
    body {
      font-family: var(--base-font-family);
      line-height: 1.85;
      color: #2d3748;
    }
    .markdown-section {
      max-width: 860px;
      padding: 30px 40px;
    }
    .markdown-section h1 {
      font-size: 2rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.4rem;
      margin-top: 1.5rem;
      color: #1a365d;
    }
    .markdown-section h2 {
      font-size: 1.5rem;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 0.3rem;
      margin-top: 2rem;
      color: #2a4365;
    }
    .markdown-section h3 {
      font-size: 1.25rem;
      color: #2c5282;
    }
    .markdown-section blockquote {
      border-left: 4px solid #3182ce;
      background: #ebf8ff;
      color: #2b6cb0;
      padding: 12px 18px;
      margin: 1.2em 0;
      border-radius: 0 6px 6px 0;
    }
    .markdown-section hr {
      border: 0;
      height: 1px;
      background: #e2e8f0;
      margin: 2.5rem 0;
    }
    .sidebar {
      background-color: #f7fafc;
      border-right: 1px solid #edf2f7;
    }
    .sidebar-nav strong {
      color: #4a5568;
      font-size: 0.9em;
      display: inline-block;
      margin-top: 10px;
    }
    .sidebar-nav ul li a {
      font-size: 14px;
      color: #4a5568;
    }
    .sidebar-nav ul li.active > a {
      color: var(--theme-color);
      font-weight: 600;
    }
    /* 検索ボックスの余白調整 */
    .sidebar .search {
      margin-bottom: 10px;
    }
    .sidebar .search input {
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="app">読み込み中...</div>
  <script>
    window.$docsify = {
      name: '📖 イザヤ書 研究ノート',
      repo: 'https://github.com/daijir/isaiah',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      notFoundPage: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '章やキーワードで検索...',
        noData: '見つかりませんでした',
        depth: 3
      },
      pagination: {
        previousText: '前の章',
        nextText: '次の章',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: 'コピー',
        errorText: 'エラー',
        successText: 'コピー完了'
      },
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(content) {
            return content.replace(/>\s*###\s*(?:📖\s*)?Webサイト版のご案内[\s\S]*?(?=\r?\n\s*---|\r?\n\s*##|$)/g, '');
          });
        }
      ]
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- 全文検索プラグイン -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- 画像ズームプラグイン -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- コードコピー機能 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- 前後の章ページ送り機能 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>
